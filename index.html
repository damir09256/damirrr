<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Travel World</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    overflow-x: hidden;
  }

  /* ================= VIDEO BACKGROUND ================= */
  .bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;

    filter: brightness(0.55) contrast(1.1) saturate(1.1);
  }

  /* спокойный тёмный слой (без цветов) */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 15, 25, 0.65);
    z-index: -1;
  }

  /* ================= HEADER ================= */
  header {
    text-align: center;
    padding: 120px 20px;
  }

  header h1 {
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  header p {
    font-size: 18px;
    color: rgba(255,255,255,0.75);
  }

  /* ================= BUTTON ================= */
  .btn {
    margin-top: 25px;
    padding: 13px 30px;
    border: none;
    border-radius: 30px;
    cursor: pointer;

    background: rgba(255,255,255,0.9);
    color: #111;
    font-weight: 600;

    transition: 0.3s ease;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }

  .btn:hover {
    transform: translateY(-3px);
    background: #ffffff;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }

  /* ================= CARDS ================= */
  .section {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 60px;
  }

  .card {
    width: 220px;
    padding: 22px;
    text-align: center;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);

    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);

    transition: 0.3s ease;
  }

  .card:hover {
    transform: translateY(-8px);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 15px 30px rgba(0,0,0,0.4);
  }

</style>
</head>

<body>

<!-- ================= VIDEO ================= -->
<video class="bg-video" autoplay muted loop playsinline>
  <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- ================= CONTENT ================= -->
<header>
  <h1>TRAVEL WORLD 🌍</h1>
  <p>Discover calm and beautiful destinations</p>
  <button class="btn">Start Journey</button>
</header>

<div class="section">
  <div class="card">🏝 Beaches</div>
  <div class="card">🏔 Mountains</div>
  <div class="card">🌆 Cities</div>
</div>

</body>
</html>
